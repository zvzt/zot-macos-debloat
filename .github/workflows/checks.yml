name: Checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n zot
          bash -n lib/*.sh
          bash -n install.sh
          bash -n uninstall.sh
          bash -n tests/test_zot.sh
      - name: Run Zot smoke tests
        run: |
          chmod +x zot tests/test_zot.sh
          tests/test_zot.sh
      - name: Check CLI basics
        run: |
          ZOT_HOME="$PWD" ./zot version
          ZOT_HOME="$PWD" ./zot --help
